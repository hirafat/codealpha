<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }

        .player-card {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .song-details { text-align: center; }
        .song-details h2 { margin: 10px 0 5px; font-size: 1.4rem; color: #333; }
        .song-details h3 { margin: 0; font-weight: 400; color: #888; font-size: 0.9rem; }

        /* Progress Bar */
        .progress-container {
            background: #eee;
            height: 6px;
            width: 100%;
            border-radius: 10px;
            margin: 25px 0 8px;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff6b6b;
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #777;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 20px 0;
        }
        .controls i {
            font-size: 22px;
            color: #ff6b6b;
            cursor: pointer;
        }
        .controls .play-btn { font-size: 45px; }

        /* Volume */
        .volume-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="range"] { accent-color: #ff6b6b; cursor: pointer; }

        /* Playlist Section */
        .playlist {
            border-top: 1px solid #eee;
            padding-top: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        .playlist h4 { margin: 0 0 10px; font-size: 14px; color: #555; }
        .song-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .song-item:hover { background: #fff1f1; }
        .song-item.active { background: #ffefef; color: #ff6b6b; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-card">
    <div class="song-details">
        <h2 id="title">Pretty Little Baby</h2>
        <h3 id="artist">YouTube Audio Library</h3>
    </div>

    <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="time-info">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <audio id="audio" src=""></audio>

    <div class="controls">
        <i class="fas fa-backward" id="prev"></i>
        <i class="fas fa-play-circle play-btn" id="play"></i>
        <i class="fas fa-forward" id="next"></i>
    </div>

    <div class="volume-box">
        <i class="fas fa-volume-down"></i>
        <input type="range" id="volume" min="0" max="1" step="0.1" value="0.7">
        <i class="fas fa-volume-up"></i>
    </div>

    <div class="playlist">
        <h4>Playlist</h4>
        <div id="playlist-container">
            </div>
    </div>
</div>

<script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const playlistContainer = document.getElementById('playlist-container');

    // Music List
    const songs = [
        { name: "Dancing with your ghost", artist: "Sasha Alex", src: "https://youtu.be/Qzc_aX8c8g4?si=FFtBhH_2eoRKzA0C" },
        { name: "Midnight City", artist: "M83 Style", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { name: "Summer Chill", artist: "Lofi Vibes", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    let songIndex = 0;
    let isPlaying = false;

    // Build Playlist UI
    function initPlaylist() {
        playlistContainer.innerHTML = '';
        songs.forEach((song, index) => {
            const div = document.createElement('div');
            div.classList.add('song-item'); 
            if(index === songIndex) div.classList.add('active');
            div.innerHTML = `<span>${song.name}</span> <span>${song.artist}</span>`;
            div.onclick = () => selectSong(index);
            playlistContainer.appendChild(div);
        });
    }

    function loadSong(song) {
        title.innerText = song.name;
        artist.innerText = song.artist;
        audio.src = song.src;
        initPlaylist(); // Refresh active class
    }

    function selectSong(index) {
        songIndex = index;
        loadSong(songs[songIndex]);
        playSong();
    }

    function playSong() {
        isPlaying = true;
        playBtn.classList.replace('fa-play-circle', 'fa-pause-circle');
        audio.play();
    }

    function pauseSong() {
        isPlaying = false;
        playBtn.classList.replace('fa-pause-circle', 'fa-play-circle');
        audio.pause();
    }

    playBtn.addEventListener('click', () => (isPlaying ? pauseSong() : playSong()));

    nextBtn.addEventListener('click', () => {
        songIndex = (songIndex + 1) % songs.length;
        loadSong(songs[songIndex]);
        playSong();
    });

    prevBtn.addEventListener('click', () => {
        songIndex = (songIndex - 1 + songs.length) % songs.length;
        loadSong(songs[songIndex]);
        playSong();
    });

    // Autoplay feature: Next song starts automatically when current ends
    audio.addEventListener('ended', () => {
        songIndex = (songIndex + 1) % songs.length;
        loadSong(songs[songIndex]);
        playSong();
    });

    // Update Progress
    audio.addEventListener('timeupdate', (e) => {
        const { duration, currentTime } = e.srcElement;
        const percent = (currentTime / duration) * 100;
        progressBar.style.width = `${percent}%`;

        // Time Updates
        document.getElementById('current-time').innerText = formatTime(currentTime);
        if(duration) document.getElementById('duration').innerText = formatTime(duration);
    });

    function formatTime(time) {
        let min = Math.floor(time / 60);
        let sec = Math.floor(time % 60);
        return `${min}:${sec < 10 ? '0'+sec : sec}`;
    }

    // Seek Click
    progressContainer.addEventListener('click', (e) => {
        const width = progressContainer.clientWidth;
        const clickX = e.offsetX;
        audio.currentTime = (clickX / width) * audio.duration;
    });

    // Volume
    document.getElementById('volume').addEventListener('input', (e) => {
        audio.volume = e.target.value;
    });

    // Load initial song
    loadSong(songs[songIndex]);

</script>
</body>
</html>
