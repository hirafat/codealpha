<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Professional Image Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f9;
    padding: 20px;
    text-align: center;
}

.title {
    margin-bottom: 20px;
    font-size: 32px;
    color: #333;
}

/* Filter Buttons */
.filters {
    margin-bottom: 20px;
}

.filters button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background: #ddd;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
    font-weight: bold;
}

.filters button.active,
.filters button:hover {
    background: #007bff;
    color: white;
}

/* Gallery Grid */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
}

.item {
    overflow: hidden;
    border-radius: 10px;
    cursor: pointer;
}

.item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
}

.item:hover img {
    transform: scale(1.1);
}

/* Lightbox */
.lightbox {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

.lightbox-img {
    max-width: 80%;
    max-height: 70%;
    border-radius: 10px;
    box-shadow: 0 0 20px black;
}

.close {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 40px;
    color: white;
    cursor: pointer;
}

.controls {
    margin-top: 15px;
}

.controls button {
    padding: 10px 20px;
    font-size: 20px;
    margin: 5px;
    border: none;
    background: white;
    cursor: pointer;
    border-radius: 5px;
    transition: 0.3s;
}

.controls button:hover {
    background: #007bff;
    color: white;
}

@media (max-width: 600px) {
    .lightbox-img {
        max-width: 95%;
    }
}
</style>
</head>

<body>

<h1 class="title">My Image Gallery</h1>

<div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="nature">Nature</button>
    <button data-filter="city">City</button>
    <button data-filter="people">People</button>
</div>

<div class="gallery">
    <!-- Nature -->
    <div class="item nature"><img src="https://picsum.photos/id/1015/600/400"></div>
    <div class="item nature"><img src="https://picsum.photos/id/1025/600/400"></div>
    <div class="item nature"><img src="https://picsum.photos/id/1043/600/400"></div>

    <!-- City -->
    <div class="item city"><img src="https://picsum.photos/id/1011/600/400"></div>
    <div class="item city"><img src="https://picsum.photos/id/1031/600/400"></div>
    <div class="item city"><img src="https://picsum.photos/id/1040/600/400"></div>

    <!-- People -->
    <div class="item people"><img src="https://picsum.photos/id/1005/600/400"></div>
    <div class="item people"><img src="https://picsum.photos/id/1027/600/400"></div>
    <div class="item people"><img src="https://picsum.photos/id/1001/600/400"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img class="lightbox-img">
    <div class="controls">
        <button id="prev">&#10094;</button>
        <button id="next">&#10095;</button>
    </div>
</div>

<script>
const items = document.querySelectorAll('.item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.close');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const filterButtons = document.querySelectorAll('.filters button');

let currentIndex = 0;

// Open Lightbox
items.forEach((img, index) => {
    img.addEventListener('click', () => {
        lightbox.style.display = "flex";
        lightboxImg.src = img.src;
        currentIndex = index;
    });
});

// Close
closeBtn.addEventListener('click', () => {
    lightbox.style.display = "none";
});

// Next
nextBtn.addEventListener('click', () => {
    currentIndex = (currentIndex + 1) % items.length;
    lightboxImg.src = items[currentIndex].src;
});

// Prev
prevBtn.addEventListener('click', () => {
    currentIndex = (currentIndex - 1 + items.length) % items.length;
    lightboxImg.src = items[currentIndex].src;
});

// Filters
filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelector('.active').classList.remove('active');
        btn.classList.add('active');

        const filter = btn.dataset.filter;
        document.querySelectorAll('.item').forEach(item => {
            if (filter === 'all' || item.classList.contains(filter)) {
                item.style.display = 'block';
            } else {
                item.style.display = 'none';
            }
        });
    });
});
</script>

</body>
</html>
